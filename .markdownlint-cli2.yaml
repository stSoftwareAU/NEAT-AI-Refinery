globs:
  - "**/*.md"
  - "**/*.markdown"

# Build output is not ours to lint — `cargo doc` ships third-party licence
# markdown under target/.
ignores:
  - "target/**"
  # `graft` repo-map nodes are generated locally (git-excluded) and quote
  # source lines verbatim, so they are not ours to lint either.
  - "graft/**"
