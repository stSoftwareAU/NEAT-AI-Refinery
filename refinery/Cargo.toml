[package]
name = "neat-ai-refinery"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance Rust tooling for producing derived NEAT-AI training corpora"

[lib]
name = "neat_ai_refinery"
path = "src/lib.rs"

[[bin]]
name = "neat_ai_refinery"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
