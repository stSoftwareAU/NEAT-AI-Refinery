name: Parity Harness

# Golden parity gate (issue #5).
#
# Runs Refinery's sampler and the extracted GRQ `Sampler.ts` reference over the
# same fixture corpora and holds both to the invariants a caller depends on,
# then proves NEAT-AI's `evolveDir` can consume a Refinery-published corpus
# unchanged. This gates the GRQ cut-over, so it runs on PRs against any base
# branch rather than only the ones `ci.yml` covers.
#
# `ci.yml` has no Deno, so the parity tests skip there; `parity/run.sh` sets
# `REFINERY_PARITY_REQUIRED=1`, turning a missing Deno into a failure and making
# this workflow the enforcing gate rather than a second opinion.

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Sampler Parity and evolveDir Consumption
    permissions:
      contents: read
    uses: ./.github/workflows/_corpus-runner.yml
    with:
      timeout-minutes: 20
      cache-key-suffix: parity
      script: ./parity/run.sh
