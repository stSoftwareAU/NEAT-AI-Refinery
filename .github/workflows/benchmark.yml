name: Benchmark

# Performance gate (issue #14).
#
# Every pull request measures Refinery's throughput, peak RSS and output size
# over the same synthetic corpus on macOS and Linux, and measures the Deno
# sampler GRQ shipped beside it in the same job.
#
# The gate is that *ratio*, not an absolute time: a hosted runner's speed
# varies from one job to the next, so an absolute threshold would either flake
# or be set so loose it caught nothing. Both samplers run on the same runner
# within seconds of each other, so their ratio is comparable between runs and
# a real regression shows up as the ratio collapsing.
#
# The corpus is smaller than a fleet run — a hosted runner has neither the disk
# nor the minutes for 1.5 GiB — so `docs/evidence/` holds the full-size reports
# and this is the regression signal.

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  benchmark:
    name: Benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install Rust and restore the Cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key-suffix: bench

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x

      - name: Measure the transforms
        # 4 × 10 000 production-shaped records is 383 MiB — large enough that
        # process start-up is noise rather than the measurement. The 1.25×
        # floor sits well below the ~1.9× measured on both a developer host and
        # a hosted runner, so it fails on a regression rather than on weather.
        run: |
          ./bench/run.sh \
            --shards 4 --records 10000 --repeats 2 \
            --min-speedup 1.25 \
            --evidence "${RUNNER_TEMP}/bench-evidence" < /dev/null

      - name: Publish the numbers to the job summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/bench-evidence/*.md)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "The benchmark produced no report — see the step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench-evidence
          if-no-files-found: error
