name: Benchmark

# Performance gate (issue #14).
#
# Every pull request measures Refinery's throughput, peak RSS and output size
# over the same synthetic corpus on macOS and Linux, and measures the Deno
# sampler GRQ shipped beside it in the same job.
#
# The gate is that *ratio*, not an absolute time: a hosted runner's speed
# varies from one job to the next, so an absolute threshold would either flake
# or be set so loose it caught nothing. Both samplers run on the same runner
# within seconds of each other, so their ratio is comparable between runs and
# a real regression shows up as the ratio collapsing.
#
# The corpus is smaller than a fleet run — a hosted runner has neither the disk
# nor the minutes for 1.5 GiB — so `docs/evidence/` holds the full-size reports
# and this is the regression signal.

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    # 4 × 10 000 production-shaped records is 383 MiB — large enough that
    # process start-up is noise rather than the measurement. The 1.25× floor
    # sits well below the ~1.9× measured on both a developer host and a hosted
    # runner, so it fails on a regression rather than on weather.
    uses: ./.github/workflows/_corpus-runner.yml
    with:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 30
      cache-key-suffix: bench
      script: ./bench/run.sh
      args: "--shards 4 --records 10000 --repeats 2 --min-speedup 1.25"
      evidence-name: bench
      job-summary: true
