name: SBOM

# Software Bill of Materials.
#
# Refinery ships a binary (`neat_ai_refinery`), so its dependency inventory
# belongs in a standard, scanner-consumable format. `Cargo.lock` already pins
# the full graph; this workflow exports it as a CycloneDX document and uploads
# it as a build artefact. When a supply-chain advisory drops ("crate X version
# Y is compromised"), the SBOM answers "are we affected, and where?" in seconds
# without a Rust toolchain.
#
# On a PR the fresh SBOM is also diffed against the one the latest successful
# push run on Develop uploaded (`scripts/sbom-diff.sh`), so a new crate is
# surfaced when it arrives rather than when an advisory names it: a new direct
# dependency gets a notice, and a new component `refinery/Cargo.toml` never
# asked for by name gets a warning annotation on the PR. The push-to-Develop
# trigger is what keeps that baseline current.
#
# Scope: active dependency vulnerabilities are owned by `cargo-audit.yml` /
# `security.yml`; this workflow only inventories and diffs the dependencies.

on:
  pull_request:
    # "**" not "*": a single star does not match "/", so PRs into
    # milestone/<slug> would silently skip this check.
    branches: ["**"]
  push:
    branches: [Develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Least-privilege: generating and uploading an SBOM only reads the checkout;
# `actions: read` lets the PR diff list Develop's runs and download their SBOM.
permissions:
  contents: read
  actions: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # Read-only build of the SBOM — the GITHUB_TOKEN must not be
          # persisted to .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Install cargo-cyclonedx (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        # Reads the resolved workspace metadata and emits a CycloneDX document
        # per crate (e.g. neat-ai-refinery.cdx.json). Refinery has no sibling
        # path dependency, so no extra checkout is needed for this to resolve.
        run: cargo cyclonedx --format json --all

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

      - name: Diff SBOM against the Develop baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASELINE_BRANCH: Develop
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$REPO" --workflow sbom.yml \
            --branch "$BASELINE_BRANCH" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::notice title=No SBOM baseline::no successful push run of sbom.yml on $BASELINE_BRANCH yet — nothing to diff against"
            exit 0
          fi
          # List this run's SBOMs before the download, so the baseline copies
          # can never be mistaken for current ones.
          mapfile -t currents < <(find . -name '*.cdx.json' -type f -not -path './target/*')
          if [[ ${#currents[@]} -eq 0 ]]; then
            echo "::error title=No SBOM::cargo cyclonedx wrote no *.cdx.json — nothing to diff"
            exit 1
          fi
          baseline="$RUNNER_TEMP/sbom-baseline"
          # A failed download fails the step: a missing baseline must not pass
          # as "no new components".
          gh run download "$run_id" --repo "$REPO" --name sbom --dir "$baseline"
          diffed=0
          for current in "${currents[@]}"; do
            previous="$(find "$baseline" -type f -name "$(basename "$current")" -print -quit)"
            if [[ -z "$previous" ]]; then
              echo "::notice title=No SBOM baseline::$current has no counterpart in run $run_id — every component is new"
              continue
            fi
            ./scripts/sbom-diff.sh "$previous" "$current" "$(dirname "$current")/Cargo.toml"
            diffed=$((diffed + 1))
          done
          echo "Diffed $diffed SBOM(s) against run $run_id"
