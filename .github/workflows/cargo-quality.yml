name: Cargo Quality

# Standalone fmt + clippy gate.
#
# `ci.yml` only fires on PRs into `Develop` / `milestone/**`. This workflow
# fires on PRs against ANY base branch (`branches: ["**"]` — a bare `*` does
# not match across `/`, so it would skip `milestone/<slug>` bases), keeping a
# small, fast, single-purpose style gate that is cheap to re-run.

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Cargo Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # fmt + clippy only — never pushes back, so the GITHUB_TOKEN must not
          # be persisted to .git/config.
          persist-credentials: false

      - name: Install Rust and restore the Cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key-suffix: quality
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if
