name: Production Soak

# Soak gate for the GRQ cut-over (issue #8).
#
# The cut-over is gated on evidence from representative macOS *and* Linux
# hosts, so the soak runs on both: repeated sampling rounds through the release
# binary at the production record shape, the Deno sampler over the same corpus
# for the throughput and peak-RSS comparison, source-immutability digests, and
# a deliberately failed run proving the published corpus survives it.
#
# The corpus is smaller than a fleet run — a hosted runner has neither the disk
# nor the minutes for 1.5 GiB — so the numbers here are a regression signal,
# not the fleet benchmark. `docs/evidence/` holds the full-size reports.

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  soak:
    name: Soak on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-soak-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-soak-
            ${{ runner.os }}-cargo-

      - name: Soak the sampler
        run: |
          ./soak/run.sh \
            --shards 2 --records 5000 --rounds 3 \
            --evidence "${RUNNER_TEMP}/soak-evidence" < /dev/null

      - name: Publish the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: ${{ runner.temp }}/soak-evidence
          if-no-files-found: error
