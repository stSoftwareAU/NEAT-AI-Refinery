# Quality bar aligned with the sibling NEAT-AI Rust subprojects
# (fmt, clippy, tests, docs, cargo-deny, security, shell checks).
#
# Job dependency graph:
#
#   validation ──┬── quality ───────────┐
#                └── security ──────────┤
#                                       ├──► ci-required  (aggregator)
#   shell-checks ────────────────────────┤
#   family-sync  ────────────────────────┘
#
# Refinery has no NEAT-AI-core path dependency, so no sibling checkout step
# appears here — the workspace resolves from crates.io alone.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone branches carry the same required checks as Develop, so PRs
      # from issue branches into a milestone must run CI too.
      - "milestone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Check for required files
        run: |
          set -euo pipefail
          required_files=(
            "Cargo.toml"
            "Cargo.lock"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "quality.sh"
            "scripts/runlib.sh"
            "deny.toml"
            "rust-toolchain.toml"
            "refinery/src/main.rs"
            ".github/CODEOWNERS"
          )
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "Missing required files: ${missing_files[*]}"
            exit 1
          fi

      - name: Validate Cargo workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

  quality:
    name: Quality Checks
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust and restore the Cargo cache
        # No cache-key suffix: this job writes the shared `<os>-cargo-` cache
        # the suffixed workflows fall back to.
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  security:
    needs: [validation]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    with:
      # `dependency-review.yml` is the single universal dependency-review gate
      # on every PR; running it here too would only duplicate the verdict.
      include-dependency-review: false

  shell-checks:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Check bash script syntax
        run: |
          set -euo pipefail
          EXIT_CODE=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK $script"
            else
              echo "FAIL $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit $EXIT_CODE

      - name: Run ShellCheck
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: Check scripts/runlib.sh already-installed contract
        run: ./scripts/test-runlib.sh

      - name: Check scripts/auto-version.sh bump and downgrade contract
        run: ./scripts/test-auto-version.sh

      - name: Check scripts/sbom-diff.sh new-component annotations
        run: ./scripts/test-sbom-diff.sh

  family-sync:
    name: Family Sync (scripts/runlib.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The comparison itself needs no write access, so it runs for fork PRs too:
    # only the push back is guarded. A fork that edits the canonical copy is
    # still caught — it just has to be corrected by hand.
    if: github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # The push token is never persisted into .git/config, where any later
          # build script could read it; it is supplied per command instead.
          persist-credentials: false

      - name: Fetch the canonical scripts/runlib.sh from NEAT-AI-core
        env:
          CANONICAL_URL: https://raw.githubusercontent.com/stSoftwareAU/NEAT-AI-core/Develop/scripts/runlib.sh
        run: |
          set -euo pipefail
          # `--fail` is what makes a fetch error an error: without it curl
          # exits 0 having written a 404 body, and that body would be committed
          # over the canonical copy as though it were the real thing.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 60 \
            --output "${RUNNER_TEMP}/runlib.sh" "$CANONICAL_URL"
          if [ ! -s "${RUNNER_TEMP}/runlib.sh" ]; then
            echo "Fetched an empty scripts/runlib.sh from ${CANONICAL_URL}" >&2
            exit 1
          fi

      - name: Refresh the copy when it has drifted
        id: compare
        run: |
          set -euo pipefail
          if cmp -s "${RUNNER_TEMP}/runlib.sh" scripts/runlib.sh; then
            echo "OK   scripts/runlib.sh is byte-identical to NEAT-AI-core Develop"
            echo "drifted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::scripts/runlib.sh has drifted from NEAT-AI-core Develop — refreshing it"
          diff -u scripts/runlib.sh "${RUNNER_TEMP}/runlib.sh" || true
          cp "${RUNNER_TEMP}/runlib.sh" scripts/runlib.sh
          chmod +x scripts/runlib.sh
          echo "drifted=true" >>"$GITHUB_OUTPUT"

      - name: Commit and push the refreshed copy
        if: >-
          steps.compare.outputs.drifted == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          HAS_PUSH_PAT: ${{ secrets.ACTIONS_PUSH != '' }}
        run: |
          set -euo pipefail
          # Which token pushed decides whether the new commit re-runs CI, so
          # say it rather than leaving the fallback silent.
          if [ "$HAS_PUSH_PAT" = "true" ]; then
            echo "Pushing with ACTIONS_PUSH — the refreshed commit will start its own CI run"
          else
            echo "Pushing with GITHUB_TOKEN — the refreshed commit starts no CI run; re-run this workflow"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/runlib.sh
          git commit -m "🪒 sync scripts/runlib.sh from NEAT-AI-core Develop"
          # `base64 | tr -d '\n'` rather than GNU-only `base64 -w0`, and the
          # encoded credential is masked: the runner's masker knows the secret,
          # not its base64, so an unmasked value would survive any later echo.
          credential="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${credential}"
          # The version-increment workflow pushes to this same branch, so
          # rebase onto whatever landed while this job ran rather than
          # clobbering it.
          git fetch --no-tags origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git rebase "origin/${HEAD_REF}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credential}" \
            push origin "HEAD:${HEAD_REF}"

      # Drift is a failure even once it has been corrected. The refreshed copy
      # is pushed, not gated: `shell-checks` ran against the bytes this PR
      # arrived with, and with the default token the new commit starts no run
      # of its own. Passing here would report unlinted, untested content as
      # checked — so the run goes red and the re-run gates the real bytes.
      - name: Fail the run when the copy had drifted
        if: steps.compare.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          echo "scripts/runlib.sh had drifted from NEAT-AI-core Develop." >&2
          if [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; then
            echo "The refreshed copy has been pushed onto this branch — re-run CI so the canonical bytes are linted and contract-tested." >&2
          else
            echo "This PR comes from a fork, so the refresh cannot be pushed — copy scripts/runlib.sh from NEAT-AI-core Develop by hand." >&2
          fi
          exit 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  ci-required:
    name: CI Required Checks
    needs: [validation, quality, security, shell-checks, family-sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          FAMILY_SYNC_RESULT: ${{ needs.family-sync.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "validation"   "$VALIDATION_RESULT"
          check "quality"      "$QUALITY_RESULT"
          check "security"     "$SECURITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          check "family-sync"  "$FAMILY_SYNC_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
